<div class="bg-black-squeeze">
  <h3 class="py-2 ps-2 pe-6" [class.bg-aqua-squeeze]="expanded()">
    <button
      type="button"
      class="font-noto-sans flex w-full content-start justify-between gap-x-4 py-2 ps-2 pe-2 text-base leading-6 font-medium tracking-normal text-shark capitalize"
      (click)="toggle()">
      <span class="text-left text-shark">
        {{ faqItem().question }}
      </span>
      <span class="text-persian-green">{{
        expanded() ? '&minus;' : '&plus;'
      }}</span>
    </button>
  </h3>
  @if (this.expanded()) {
    <div>
      <p
        class="font-noto-sans px-5 py-4 text-sm leading-relaxed font-normal tracking-normal text-storm-dust">
        {{ faqItem().answer }}1
      </p>
    </div>
  }
</div>
